name: photo_link_vr
description: Photo recording, NFC linking, and immersive replay app.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cached_network_image: ^3.4.1
  dio: ^5.7.0
  go_router: ^14.6.2
  hive: ^2.2.3
  image_picker: ^1.1.2
  nfc_manager: ^4.2.1
  photo_manager: ^3.6.3
  photo_view: ^0.15.0
  riverpod: ^2.6.1
  flutter_riverpod: ^2.6.1
  video_player: ^2.9.2
  flutter_map: ^8.3.0
  latlong2: ^0.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
